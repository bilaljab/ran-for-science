rules:
  - id: use-server-exports-only-actions
    languages: [typescript]
    severity: HIGH
    message: >-
      A "use server" file may only export async functions, and every export is a public HTTP endpoint callable by
      anyone. This non-async export (function, constant, class or variable) is either a build error or an
      accidentally published endpoint/value. Move constants, schemas and sync helpers to a normal module (for
      example constants/ or lib/) and keep them un-exported or imported from there. Type-only exports are fine.
    metadata:
      category: security
      cwe: "CWE-749: Exposed Dangerous Method or Function"
      confidence: HIGH
    paths:
      exclude:
        - "/src/generated/"
    patterns:
      - pattern-inside: |
          "use server";
          ...
      - pattern-either:
          - patterns:
              - pattern: export function $F(...) { ... }
              - pattern-not: export async function $F(...) { ... }
          - pattern: export class $C { ... }
          - patterns:
              - pattern-either:
                  - pattern: export const $X = $V
                  - pattern: export let $X = $V
                  - pattern: export var $X = $V
              # `async` modifiers are ignored by pattern matching, so async arrows/functions are told apart by source text.
              - metavariable-regex:
                  metavariable: $V
                  regex: ^(?!async )
